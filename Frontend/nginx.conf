server {
    # Docker daxili DNS - backend konteyneri yeniden yarandigda IP deyise biler,
    # sabit IP cache-lenmesin diye deyiskenle yollayiriq.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $wildcard_backend backend:8080;

    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: bilinmeyen yollar index.html-e duser (react-router / hash routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- API: diger konteynerdekI backend-e proxy ----
    location /api/ {
        proxy_pass http://$wildcard_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- yuklenen fayllar ----
    location /files/ {
        proxy_pass http://$wildcard_backend;
        proxy_set_header Host $host;
    }

    # ---- WebSocket (live bildiris + chat) ----
    location /ws {
        proxy_pass http://$wildcard_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- Swagger ----
    location /v3/api-docs { proxy_pass http://$wildcard_backend; }
    location /swagger-ui  { proxy_pass http://$wildcard_backend; }

    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}