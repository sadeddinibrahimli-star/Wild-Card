# "dev" profile = local development.
# The H2 database lives in RAM. NEVER use this for production -

spring:
  datasource:
    url: jdbc:h2:mem:wildcard;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      # "update": creates the tables automatically from the entities.
      # in production this must be "validate" or Flyway (migrations)!
      ddl-auto: update
    open-in-view: false

  h2:
    console:
      enabled: true

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 4MB
server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

wildcard:
  # DEV ONLY: local admin seed for development. These values do NOT apply to
  # prod/docker - those profiles read the password only from the environment.
  admin:
    enabled: ${ADMIN_SEED_ENABLED:true}
    email: ${ADMIN_EMAIL:admin@wildcard.local}
    password: ${ADMIN_PASSWORD:dev-admin-local-only}

  jwt:
    # HS256 needs at least 32 characters
    secret: ${JWT_SECRET:}
    issuer: wild-card
    access-token-expiration-minutes: 30
    refresh-token-expiration-days: 14

  # Forgot-password link: {frontend-url}/#reset/{token}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  require-secrets: false

  storage:
    local-dir: ${STORAGE_DIR:uploads}

  rate-limit:
    window-seconds: 60
    posts-per-window: 5
    comments-per-window: 10
    watchlist-per-window: 10

  affinity:
    # added with every reaction
    reaction-weight: 1.0
    # above this value the topic counts as "liked"
    threshold: 5.0
    # when the user picks the topic themselves, this much is added
    explicit-score: 10.0

  seed:
    # Local demo data. To use it, set SEED_ENABLED=true and SEED_USER_PASSWORD
    # in .env (see .env.example).
    enabled: ${SEED_ENABLED:false}
    user-password: ${SEED_USER_PASSWORD:}

# LOCAL mailbox (password reset links are collected here when SMTP is missing)
  dev-mailbox:
    enabled: ${DEV_MAILBOX_ENABLED:true}
    file: ${DEV_MAILBOX_FILE:./dev-mailbox.log}

  external:
    tmdb:
      api-key: ${TMDB_API_KEY:}
      base-url: https://api.themoviedb.org/3
      image-base: https://image.tmdb.org/t/p/w185
    mail:
      host: ${MAIL_HOST:}
      port: ${MAIL_PORT:}
      username: ${MAIL_USERNAME:}
      password: ${MAIL_PASSWORD:}
      from: ${MAIL_FROM:}
    http:
      timeout-seconds: 5
      cache-minutes: 10
