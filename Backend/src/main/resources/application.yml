# Main file. It only decides which profile to activate.
# The profile itself lives in application-dev.yml.

spring:
  application:
    name: wild-card

  # activating the "dev" profile -> Spring automatically reads application-dev.yml.
  # In production changing this line to "prod" is enough, no code change.
  profiles:
    active: dev

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 4MB

wildcard:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiration-minutes: 60
    refresh-token-expiration-days: 30
    issuer: wild-card

  storage:
    local-dir: ${STORAGE_DIR:uploads}
