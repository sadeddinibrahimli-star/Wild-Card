# "docker" profile = running locally with Docker Compose.
# No H2! H2 lives in RAM and the database is wiped every time the
# container STARTS. Docker needs a persistent database -> PostgreSQL.

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # local demo: creates the tables automatically.
      # on a REAL server this must be "validate", otherwise you lose everything.
      ddl-auto: update
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 4MB
server:
  port: 8080
  # nginx forwards to this port
  forward-headers-strategy: framework
  error:
    include-stacktrace: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

wildcard:
  jwt:
    # 32+ characters. When empty the app generates a dev key and logs WARN.
    secret: ${JWT_SECRET}
    issuer: wild-card
    access-token-expiration-minutes: 30
    refresh-token-expiration-days: 14

  admin:
    # The first admin account is only seeded when ADMIN_SEED_ENABLED=true.
    enabled: ${ADMIN_SEED_ENABLED:false}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD}

  # Forgot-password link: {frontend-url}/#reset/{token}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  require-secrets: true

  storage:
    # pictures are stored here and served from /files/**
    local-dir: ${STORAGE_DIR:/app/uploads}

  rate-limit:
    window-seconds: 60
    posts-per-window: 5
    comments-per-window: 10
    watchlist-per-window: 10

  affinity:
    reaction-weight: 1.0
    threshold: 5.0
    explicit-score: 10.0

  seed:
    # Local demo data. To use it, set SEED_ENABLED=true and SEED_USER_PASSWORD
    # in .env (see .env.example).
    enabled: ${SEED_ENABLED:false}
    user-password: ${SEED_USER_PASSWORD:}

# LOCAL mailbox (password reset links are collected here when SMTP is missing)
  dev-mailbox:
    enabled: ${DEV_MAILBOX_ENABLED:true}
    file: ${DEV_MAILBOX_FILE:./dev-mailbox.log}

  external:
    tmdb:
      api-key: ${TMDB_API_KEY:}
      base-url: https://api.themoviedb.org/3
      image-base: https://image.tmdb.org/t/p/w185
    mail:
      host: ${MAIL_HOST:}
      port: ${MAIL_PORT:}
      username: ${MAIL_USERNAME:}
      password: ${MAIL_PASSWORD:}
      from: ${MAIL_FROM:}
    http:
      timeout-seconds: 5
      cache-minutes: 10

logging:
  level:
    com.wildcard: INFO
