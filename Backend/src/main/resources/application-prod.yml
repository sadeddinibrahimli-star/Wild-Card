# "prod" profile = production.
# No secret in this profile has a default value.
# If an env variable is missing the application FAILS TO START - silence is not allowed.
#   DB_PASSWORD / JWT_SECRET / ADMIN_PASSWORD  ->  mandatory
# how to start:
#   export SPRING_PROFILES_ACTIVE=prod
#   export DB_PASSWORD=...  JWT_SECRET=...  ADMIN_PASSWORD=...
#   java -jar app.jar

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD:?DB_PASSWORD is required}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # ddl-auto "update" is NOT allowed in production - the schema is managed by code.
      # "validate" checks the changes and creates nothing.
      ddl-auto: validate
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 4MB

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    # stack traces are never shown to the user
    include-stacktrace: never
    include-message: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

wildcard:
  jwt:
    # REQUIRED. 32+ characters. Not a warning - the app will not start.
    secret: ${JWT_SECRET}
    issuer: wild-card
    access-token-expiration-minutes: ${JWT_ACCESS_MINUTES:30}
    refresh-token-expiration-days: ${JWT_REFRESH_DAYS:14}

  admin:
    # First admin account. The password is REQUIRED.
    enabled: ${ADMIN_SEED_ENABLED:false}
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}

  seed:
    # demo data is disabled in production
    enabled: false
    user-password: ""

  # Forgot-password link: {frontend-url}/#reset/{token}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  require-secrets: true

  storage:
    local-dir: ${STORAGE_DIR:./uploads}

  # the mailbox is disabled in production
  dev-mailbox:
    enabled: false
    file: ""

  external:
    tmdb:
      api-key: ${TMDB_API_KEY:}
      base-url: https://api.themoviedb.org/3
      image-base: https://image.tmdb.org/t/p/w185
    mail:
      host: ${MAIL_HOST:}
      port: ${MAIL_PORT:25}
      username: ${MAIL_USERNAME:}
      password: ${MAIL_PASSWORD:}
      from: ${MAIL_FROM}
    http:
      timeout-seconds: 5
      cache-minutes: 10

logging:
  level:
    root: INFO
    com.wildcard: INFO
  # no secret is ever written to the log